<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CalculadoraIMC</title>
</head>
<body>
    <!-- mains una etiqueta que envuelva todo el contenido, 
     tiene article, figure, p, section, (es mas semantica) -->
    <header>
        <h1>Calculadora de IMC 🧸</h1>
    </header>
    <div class="box">
        <input type="number" id="peso" placeholder="Peso (kg)">
        <input type="number" id ="altura" placeholder="Altura (m)">
        <p id="resultado">Resultado:</p>
        <p id="valorIMC">ValorIMC</p>
    </div>
    <div class="boton">
        <button class="calcularIMC" onclick="calcularIMC()">Calcular IMC</button>
    </div>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
